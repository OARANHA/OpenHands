name: Wandora — Build owned OpenHands image

# Manual only: no push, PR, schedule, fork sync, or upstream publication.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested image to ghcr.io/oaranha/openhands-wandora
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: wandora-owned-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'OARANHA/OpenHands'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout our Canvas
        uses: actions/checkout@v7
        with:
          path: canvas
          persist-credentials: false

      - name: Read reviewed SDK SHA
        id: pin
        working-directory: canvas
        run: |
          SDK_SHA=$(node -p "require('./config/wandora-image.json').sdkCommit")
          [[ "$SDK_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "sha=$SDK_SHA" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout our SDK at exact pinned commit
        uses: actions/checkout@v7
        with:
          repository: OARANHA/software-agent-sdk
          ref: ${{ steps.pin.outputs.sha }}
          path: sdk
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sdk rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          test -z "$(git -C sdk status --porcelain)"
          test -z "$(git -C canvas status --porcelain)"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: canvas/package-lock.json

      - name: Test Canvas
        working-directory: canvas
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm run build:lib

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
          python-version: "3.13"

      - name: Test owned Agent Server
        working-directory: sdk
        run: |
          uv sync --frozen --dev
          uv run pytest tests/agent_server/test_llm_router.py

      - name: Build both owned local images
        working-directory: canvas
        run: node scripts/wandora-build.mjs ../sdk

      - name: Verify final image contains the owned Agent Server
        shell: bash
        run: |
          set -euo pipefail
          SDK_SHORT="$(git -C sdk rev-parse --short=12 HEAD)"
          CANVAS_SHORT="$(git -C canvas rev-parse --short=12 HEAD)"
          FINAL_IMAGE="ghcr.io/oaranha/openhands-wandora:canvas-${CANVAS_SHORT}-sdk-${SDK_SHORT}"
          docker image inspect "$FINAL_IMAGE" >/dev/null
          docker run --rm --entrypoint /bin/sh "$FINAL_IMAGE" -c \
            'test -x /agent-server/.venv/bin/python && /agent-server/.venv/bin/python -c "import openhands.agent_server.llm_router"'
          echo "FINAL_IMAGE=$FINAL_IMAGE" >> "$GITHUB_ENV"
          echo "Built and checked locally: $FINAL_IMAGE" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to our GHCR only when requested
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish our final image only
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FINAL_IMAGE" in
            ghcr.io/oaranha/openhands-wandora:canvas-*-sdk-*) ;;
            *) exit 1 ;;
          esac
          docker push "$FINAL_IMAGE"
          echo "Published: $FINAL_IMAGE" >> "$GITHUB_STEP_SUMMARY"
